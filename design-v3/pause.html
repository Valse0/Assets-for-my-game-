<!doctype html>
<html lang="en" data-theme="dusk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FIVEMORE — Pause Overlay (v3)</title>
    <link rel="stylesheet" href="atmosphere.css">
    <link rel="stylesheet" href="buttons.css">
    <link rel="stylesheet" href="hud.css">
    <link rel="stylesheet" href="pause.css">
  </head>
  <body>
    <main class="game-stage">
      <canvas id="game-canvas" aria-hidden="true"></canvas>
      <div class="atmosphere-layer" aria-hidden="true"></div>

      <header class="game-hud" style="--hp: 76; --xp: 64;" aria-hidden="true">
        <div class="hud-panel">
          <div class="hud-row hp-row">
            <span class="hud-label">
              <svg class="hud-heart-icon" viewBox="0 0 12 10" shape-rendering="crispEdges" aria-hidden="true">
                <path fill="#0a090d" d="M2 0h3v1h2V0h3v1h1v1h1v3h-1v2H9v1H8v1H7v1H5V9H4V8H3V7H1V5H0V2h1V1h1z"/>
                <path fill="currentColor" d="M2 1h3v1h2V1h3v1h1v3h-1v1H9v1H8v1H7v1H5V8H4V7H3V6H2V5H1V2h1z"/>
              </svg>
              <span id="hp-label">76 HP</span>
            </span>
            <span class="meter-track hp-track"><i class="meter-fill hp-fill"></i></span>
          </div>
          <div class="hud-row xp-row">
            <span class="hud-label"><span class="lv-badge" id="level-label">LV 7</span></span>
            <span class="meter-track xp-track"><i class="meter-fill xp-fill"></i></span>
          </div>
        </div>
        <div class="hud-meta-row">
          <span class="hud-box run-timer" id="run-timer">2:03</span>
          <span class="hud-box run-score-box"><span class="run-score-label">SCORE</span><span>001840</span></span>
        </div>
      </header>

      <button class="fm-btn fm-btn-icon pause-button" id="pause-game" type="button" aria-label="Pause game">
        <span class="pause-glyph" aria-hidden="true"><i></i><i></i></span>
      </button>

      <div class="virtual-stick" id="virtual-stick" aria-hidden="true">
        <span class="virtual-stick-knob"></span>
      </div>

      <section class="pause-overlay" id="pause-overlay" role="dialog" aria-modal="true" aria-labelledby="pause-title">
        <div class="pause-panel">
          <p class="pause-eyebrow">RUN SUSPENDED</p>
          <h1 class="pause-title" id="pause-title">PAUSED</h1>
          <div class="pause-actions">
            <button class="fm-btn fm-btn-play" id="pause-resume" type="button">RESUME</button>
            <button class="fm-btn fm-btn-settings" id="pause-restart" type="button">RESTART</button>
            <button class="fm-btn fm-btn-settings" id="pause-menu" type="button">MENU</button>
          </div>
          <p class="pause-note">Hold out. The horde waits outside the firelight.</p>
        </div>
      </section>
    </main>

    <script>
      (() => {
        const theme = new URLSearchParams(location.search).get("theme");
        if (theme === "dusk" || theme === "dust" || theme === "night") {
          document.documentElement.dataset.theme = theme;
        }
        const canvas = document.getElementById("game-canvas");
        const ctx = canvas.getContext("2d");
        function drawBg() {
          const w = window.innerWidth;
          const h = window.innerHeight;
          const dpr = Math.max(1, window.devicePixelRatio || 1);
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.imageSmoothingEnabled = false;
          for (let y = 0; y < h; y += 32) {
            for (let x = 0; x < w; x += 32) {
              const hash = ((x * 73856093) ^ (y * 19349663)) >>> 0;
              ctx.fillStyle = hash % 4 === 0 ? "#667e3b" : "#738e44";
              ctx.fillRect(x, y, 32, 32);
              ctx.fillStyle = "rgba(10,9,13,0.22)";
              ctx.fillRect(x, y, 32, 1);
              ctx.fillRect(x, y, 1, 32);
            }
          }
        }
        drawBg();
        window.addEventListener("resize", drawBg);
      })();
    </script>
  </body>
</html>
